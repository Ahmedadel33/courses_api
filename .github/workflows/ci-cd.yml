name: Secure CI Pipeline for Codezone Backend

on:
  push:
    branches: [ "main" ]

jobs:
  security-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      # 1. Secret Check (Gitleaks)
      - name: Gitleaks Scan (Secret Check)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 2. SCA Check (npm audit)
      - name: Software Composition Analysis (SCA)
        run: npm audit --audit-level=critical || true

      # 3. Build Docker image locally
      - name: Build Docker image locally
        run: docker build -t codezone-app:latest .

      # 4. Image Security Check (Trivy - OS Only)
      - name: Run Trivy vulnerability scanner for Docker Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'codezone-app:latest'
          format: 'table'
          exit-code: '1'
          vuln-type: 'os'
          severity: 'CRITICAL,HIGH'