name: Secure CI Pipeline for Codezone Backend

on:
  push:
    branches: [ "main" ]

jobs:
  security-and-build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm install

     - name: Gitleaks Scan (Secret Check)
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

     - name: Software Composition Analysis (SCA)
      run: npm audit --audit-level=high

     - name: Static Application Security Testing (SAST)
      run: |
        npm install -g retire
        retire --node

     - name: Build Docker image locally
      run: docker build -t codezone-app:latest .

     - name: Run Trivy vulnerability scanner for Docker Image
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'codezone-app:latest'
        format: 'table'
        exit-code: '1'
        vuln-type: 'os,package'
        severity: 'CRITICAL,HIGH'  

